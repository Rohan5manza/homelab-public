name: Build and publish Systems Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Scheduled runs are best-effort and may be delayed by GitHub.
    - cron: '19 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install docs dependencies
        run: python -m pip install -r tools/requirements-build.txt
      - name: Build documentation
        run: python tools/build_docs.py
      - name: Check explicitly enabled public URLs
        run: python tools/check_status.py
      - name: Validate output
        run: python -m unittest discover -s tests -v
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload public files only
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/lab
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
