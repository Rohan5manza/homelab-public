# EXAMPLE ONLY — not exported from the actual live device.
# Never commit a real secrets.yaml, encryption key, Wi-Fi SSID or password.
# Review pin wiring and the current ESPHome version before flashing.
esphome:
  name: room-node-example
  friendly_name: Room Sensor Example

esp8266:
  board: d1_mini

logger:

api:
  encryption:
    key: !secret room_node_api_encryption_key

ota:
  - platform: esphome
    encryption: {}  # Reuses the native API encryption key; verify OTA migration before flashing

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# D1 mini common I2C pins: SDA D2 (GPIO4), SCL D1 (GPIO5)
i2c:
  sda: D2
  scl: D1
  scan: true

sensor:
  - platform: bme280_i2c
    address: 0x76 # some breakouts use 0x77
    temperature:
      name: Room Example Temperature
      oversampling: 16x
    pressure:
      name: Room Example Pressure
    humidity:
      name: Room Example Humidity
    update_interval: 30s
